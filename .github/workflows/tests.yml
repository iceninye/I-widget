name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Widget smoke test
        run: python3 test_widget.py

      - name: Launcher archive and local-cache validation
        run: python3 test_launcher.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scriptable tests in distinct process timezones
        run: |
          for zone in UTC Asia/Hong_Kong America/New_York Pacific/Kiritimati; do
            echo "=== TZ=$zone ==="
            TZ="$zone" node scriptable/test-i-widget.js
          done
