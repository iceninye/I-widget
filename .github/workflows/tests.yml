name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Widget smoke test
        run: python3 test_widget.py

      - name: Launcher update logic
        run: python3 test_launcher.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scriptable version
        run: node scriptable/test-i-widget.js
