name: Update fingerprint

# i_widget.py 一改，就自動更新 i_widget.fingerprint。
# 冇佢的話 launcher 永遠睇唔出有新版本，等於靜靜壞咗。

on:
  push:
    branches: [main]
    paths:
      - i_widget.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update fingerprint
        run: python3 make_fingerprint.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- i_widget.fingerprint; then
            echo "fingerprint 無變，唔使 commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i_widget.fingerprint
          git commit -m "Update fingerprint"
          git push